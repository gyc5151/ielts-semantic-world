<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f4ee" />
    <title>IELTS Semantic World · Scene Branches</title>
    <link rel="stylesheet" href="./styles.css?v=pilot-28-0-r1" />
    <link rel="stylesheet" href="./themes.css?v=pilot-28-0" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="学习导航">
        <a class="brand" href="#home" id="brandLink">
          <span class="brand-mark" aria-hidden="true">ISW</span>
          <span><strong>IELTS Semantic World</strong></span>
        </a>
        <div class="sidebar-section">
          <h2 id="sidebarTitle">场景</h2>
        </div>
        <nav class="scene-nav" id="sceneNav" aria-label="微场景"></nav>
        <div class="sidebar-section sidebar-bottom">
          <div class="sidebar-actions">
            <button class="secondary-btn" type="button" id="reviewNav">复习 <span id="dueCount" hidden></span></button>
            <button class="text-btn" type="button" id="exportBtn">导出记录</button>
          </div>
        </div>
      </aside>

      <div class="content-column">
        <header class="topbar">
          <span class="eyebrow" id="sceneCountLabel">IELTS Semantic World</span>
          <div class="topbar-actions">
            <button class="text-btn" type="button" id="homeNav">全部故事</button>
            <button class="text-btn" type="button" id="reviewTopNav">复习</button>
            <button class="text-btn" type="button" id="unitsNav">表达记录</button>
            <button class="text-btn" type="button" id="aboutNav">关于</button>
          </div>
        </header>
        <p class="storage-warning" id="storageStatus" role="status" hidden>浏览器暂时不能保存记录；请在离开前导出练习记录。</p>
        <main class="main" id="app" tabindex="-1">
          <div class="loading">载入中…</div>
        </main>
        <footer class="site-footer">IELTS Semantic World</footer>
      </div>
    </div>
    <dialog id="glossaryDialog" class="glossary-dialog" aria-labelledby="glossaryHeadword"></dialog>
    <script type="module" src="./main.js?v=pilot-28-0-r2"></script>
  </body>
</html>
